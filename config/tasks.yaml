  description: 收盘前 14:50 用自有数据出「四维读数 + 底部结构」事实底稿（级别/结构/谁在买/够不够得着 + W底颈线红三兵不破位黑K），交
    Pi 按狼大 B反 框架 v2 判断后推送 QQ。只观察：不写策略链、不接交易、不接 gate（task_name 含「风向标」⇒ 跳过信号写入）。设计依据
    docs/b-rebound-framework-v2.md 与 docs/b-rebound-case-journal.md
  enabled: true
  schedule:
