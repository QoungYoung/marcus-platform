tasks:
- id: golden_pit_morning
  name: 黄金坑盘前报告
  description: 8:50 盘前生成黄金坑状态报告+阈值穿越检测，推送到QQ
  enabled: true
  type: golden_pit
  schedule:
    type: cron
    expr: 50 8 * * mon-fri
    timezone: Asia/Shanghai
  notifications:
    on_success: true
    on_failure: true
    channels:
    - qqbot
  depends_on: []
- id: golden_pit_snapshot
  name: 黄金坑日快照
  description: 15:30 收盘后保存每日快照到数据库
  enabled: true
  type: golden_pit
  schedule:
    type: cron
    expr: 30 15 * * mon-fri
    timezone: Asia/Shanghai
  notifications:
    on_success: false
    on_failure: true
    channels:
    - qqbot
  depends_on: []
- id: golden_pit_sync_pre_market
  name: 黄金坑盘前同步
  description: 9:00 盘前同步贪婪指数到数据库，确保开盘后 /status 走 DB 读取
  enabled: true
  type: golden_pit
  schedule:
    type: cron
    expr: 0 9 * * mon-fri
    timezone: Asia/Shanghai
  notifications:
    on_success: false
    on_failure: true
    channels:
    - qqbot
  depends_on: []
- id: golden_pit_dca_morning
  name: 黄金坑DCA定投 (早盘)
  description: 09:36 执行早盘买入批次的指数 (buy_time 在 09:35-09:40 窗口)
  enabled: true
  type: golden_pit_dca
  schedule:
    type: cron
    expr: 36 9 * * mon-fri
    timezone: Asia/Shanghai
  notifications:
    on_success: true
    on_failure: true
    pi_analysis: true
    channels:
    - qqbot
  depends_on: []
- id: golden_pit_dca_afternoon
  name: 黄金坑DCA定投 (尾盘)
  description: 14:44 执行尾盘买入批次的指数 (buy_time 在 14:15-14:55 窗口)
  enabled: true
  type: golden_pit_dca
  schedule:
    type: cron
    expr: 44 14 * * mon-fri
    timezone: Asia/Shanghai
  notifications:
    on_success: true
    on_failure: true
    pi_analysis: true
    channels:
    - qqbot
  depends_on: []
