- id: wave_breb_watch
  name: B反 尾盘信号（缩量转放量 → 推 QQ）
  description: '★ 2026-10-22 用户：「加"缩量→放量"分钟级信号」「尾盘能检测到 B反 也可以」。

    每交易日 **14:50**（收盘前 10 分钟 ✓ 还能动手 ✓）检查 170/512480 的分钟线：

    某分钟量 ≥ 前 30 分钟均量 3 倍 且 该分钟下跌 ⇒ 推 QQ ✓（一天一标的只推一次 ✓）。

    实测：588170 在 2026-08-03~08-14 命中 8/10 天 ✓，08-03 当天 14:07 就报（当日低 0.828 / 信号 0.837
    ✓）

    ⇒ **比日线 down_tag 早 2 个交易日** ✓；6 月窗口与日线同日 ✓。

    ⚠️ 只作**提前提示** ✓ 不是买入指令 ✗ 不参与闸门 ✗ 不改 wave_state ✗。

    '
  enabled: false
  schedule:
    type: cron
    expr: 50 14 * * mon-fri
    timezone: Asia/Shanghai
  script:
    path: jobs/wave_breb_watch.py
    args: []
  output:
    log_file: logs/wave_breb_watch_{date}.log
    append: true
  notifications:
    on_success: false
    on_failure: false
    pi_analysis: false
    channels:
    - qqbot
- id: macro_briefing_push
  name: 宏观事件晨报推送（把 DSH agent 的晨报推 QQ）
  description: '08:35 读 data/macro_briefing_<当日>.md（由 DSH agent 任务「宏观事件晨报」在 08:20
    生成 ✓）并推 QQ ✓。

    分工刻意分开：**分析**在 DSH agent（它会调 marcus-panel-tools 的只读数据工具 + 读持仓 ✓）；

    **投递**在平台侧（DSH 没有推送端点 ✗）。无当日晨报 ⇒ 直接退出 0（fail-open ✓ 节假日/agent未跑都走这条 ✓）；

    data/_macro_briefing_pushed.json 去重 ⇒ 同日重复跑不会重复推 ✓。

    '
  enabled: false
  schedule:
    type: cron
    expr: 35 8 * * mon-fri
    timezone: Asia/Shanghai
  script:
    path: jobs/push_macro_briefing.py
    args: []
  output:
    log_file: logs/macro_briefing_push_{date}.log
    append: true
  notifications:
    on_success: false
    on_failure: false
