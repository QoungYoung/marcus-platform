server {
    listen 80;
    server_name marcus.tsingyoung.uk;
    root /usr/share/nginx/html;
    index index.html;

    # ★ 2026-10-09（用户拍板「B 治本」）：上游用 **Docker 内嵌 DNS 动态解析** ✓
    #   原因（实测 ✗）：原来 `proxy_pass http://backend:8000;` 是**静态主机名** ⇒ nginx 只在**启动时**
    #     解析一次并缓存 IP ✗；而"加载 env 变更"必须 `compose up -d backend worker` **重建容器**
    #     ⇒ 后端 IP 变（172.19.0.2 → 172.19.0.3）而 frontend 容器 4 周没重启 ⇒ 一直指向旧 IP ✗
    #     ⇒ 前端 502（nginx 错误日志：`connect() failed (111: Connection refused) …
    #        upstream: "http://172.19.0.2:8000/…"` ✓ 而当时 backend 已是 .3 ✓）。
    #   做法 ✓：`resolver 127.0.0.11`（Docker 内嵌 DNS）+ **变量形式** `proxy_pass`
    #     ⇒ 按 `valid=10s` 动态重解析 ⇒ 后端重建后 ~10s 内自动跟上，**不必再手动重启 nginx** ✓
    #   ⚠️ 语义保持 ✓：变量里**不带 URI** + 指令里带路径 ⇒ 用指令里的路径（与原来一致 ✓）；
    #      指令里**不带路径** ⇒ 透传原始请求 URI（与原来一致 ✓）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Panel SSE stream → DSH 容器直连，绕过后端缓冲层
    location = /api/v1/panel/reflect/stream {
        set $up_dsh_stream dsh:3001;
        proxy_pass http://$up_dsh_stream/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
    }

    # API proxy (SSE needs buffering off)
    location /api/ {
        set $up_backend backend:8000;
        proxy_pass http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # SSE support: disable proxy buffering for streaming responses
        proxy_buffering off;
        gzip off;
    }

    # DSH 容器代理（Pi Server 已由 DSH 替代）
    location /pi/ {
        set $up_dsh dsh:3001;
        proxy_pass http://$up_dsh/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        set $up_backend_ws backend:8000;
        proxy_pass http://$up_backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
