# Marcus AI Trading Platform - Docker Compose Configuration

# backend / worker 共用：环境变量 + 挂载（调度/监控/QQ Bot 已拆分到 worker 进程）
x-backend-common: &backend-common
  env_file:
    - ../.env
  environment:
    TZ: Asia/Shanghai
    MARCUS_WORKSPACE: /app
    PI_SERVER_URL: http://piserver:3001/chat
    DATABASE_URL: postgresql://marcus:${DB_PASSWORD:-marcus123}@postgres:5432/marcus_trading
    EASTMONEY_COOKIE: ${EASTMONEY_COOKIE}
    EM_PROXY_URL: http://81.70.44.68:8199
    QT_QPA_PLATFORM: offscreen
    ENGINE_BACKEND: vnpy
  volumes:
    - ../data:/app/data
    - ../apps:/app/apps:ro
    - ../config:/app/config
    - ../logs:/app/logs
    - ../memory:/app/memory
    - /etc/localtime:/etc/localtime:ro

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: marcus-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      POSTGRES_USER: marcus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marcus123}
      POSTGRES_DB: marcus_trading
      TZ: Asia/Shanghai
    ports:
      # 外部访问用 "5432:5432"，仅本机访问用 "127.0.0.1:5432:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcus -d marcus_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API（纯 HTTP；调度/监控/QQ Bot 已移至 worker 服务）
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: marcus-backend
    <<: *backend-common
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 进程（调度任务 + 止损/加仓/候选池/长期候选池监控 + QQ Bot 通知）
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: marcus-worker
    <<: *backend-common
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.worker_main
    healthcheck:
      # 心跳在 worker_status 表；read_status().online 为 false 即视为不健康
      test: ["CMD-SHELL", "python -c \"from app.services.worker_control import read_status; import sys; sys.exit(0 if read_status().get('online') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Pi Server (Pi Agent HTTP Server)
  piserver:
    deploy:
      resources:
        limits:
          memory: 256M
    build:
      context: ..
      dockerfile: docker/Dockerfile.piserver
    container_name: marcus-piserver
    env_file:
      - ../.env
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PI_SERVER_PORT: "3001"
      MARCUS_API_URL: http://backend:8000/api/v1
    ports:
      - "3001:3001"
    volumes:
      - ../servers/pi-server/sessions:/app/sessions
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (本地预构建 dist，Dockerfile 只 COPY 到 nginx)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: marcus-frontend
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "80:80"
    depends_on:
      - backend
      - piserver

volumes:
  pgdata: