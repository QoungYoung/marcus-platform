# Marcus AI Trading Platform - Docker Compose Configuration

# backend / worker 共用：环境变量 + 挂载（调度/监控/QQ Bot 已拆分到 worker 进程）
x-backend-common: &backend-common
  env_file:
    - ../.env
  environment:
    TZ: Asia/Shanghai
    MARCUS_WORKSPACE: /app
    PI_SERVER_URL: http://dsh:3001/chat
    DATABASE_URL: postgresql://marcus:${DB_PASSWORD:-marcus123}@postgres:5432/marcus_trading
    EASTMONEY_COOKIE: ${EASTMONEY_COOKIE}
    EM_PROXY_URL: http://81.70.44.68:8199
    QT_QPA_PLATFORM: offscreen
    ENGINE_BACKEND: vnpy
    MARCUS_API_URL: http://backend:8000/api/v1
    # 无 tty 下 stdout 块缓冲会吞掉 print 日志（TMonitor/t-build/回测等启动行不显示）
    PYTHONUNBUFFERED: "1"
    # 容器内以 root 运行会往源码目录写 pycache（属主变 root）；关闭字节码缓存
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ../data:/app/data
    - ../apps:/app/apps:ro
    - ../config:/app/config
    - ../logs:/app/logs
    - ../memory:/app/memory
    # 代码 bind mount：backend/app 与 core 直接挂载（与 apps/ 同理），
    # 代码改动即时生效、容器重建后不丢；无需每次重建镜像（本机无法访问 PyPI 重建镜像）
    - ../backend/app:/app/app
    - ../core:/app/core
    # jobs 也 bind mount：market_scan 等任务脚本改动即时生效（镜像内 COPY jobs 会遮旧版）
    - ../jobs:/app/jobs
    - /etc/localtime:/etc/localtime:ro

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: marcus-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      POSTGRES_USER: marcus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marcus123}
      POSTGRES_DB: marcus_trading
      TZ: Asia/Shanghai
    ports:
      # 外部访问用 "5432:5432"，仅本机访问用 "127.0.0.1:5432:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcus -d marcus_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API（纯 HTTP；调度/监控/QQ Bot 已移至 worker 服务）
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: marcus-backend
    <<: *backend-common
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 进程（调度任务 + 止损/加仓/候选池/长期候选池监控 + QQ Bot 通知）
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: marcus-worker
    <<: *backend-common
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python -m app.worker_main
    healthcheck:
      # 心跳在 worker_status 表；read_status().online 为 false 即视为不健康
      test: ["CMD-SHELL", "python -c \"from app.services.worker_control import read_status; import sys; sys.exit(0 if read_status().get('online') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # DSH Server (DeepSeek Harness 常驻服务，替代 Pi Server)
  dsh:
    deploy:
      resources:
        limits:
          memory: 4G
    build:
      context: ..
      dockerfile: docker/Dockerfile.dsh.020
    container_name: marcus-dsh
    env_file:
      - ../.env
    environment:
      NODE_OPTIONS: --max-old-space-size=12288
      BRIDGE_FORK_SEED: "0"
      TZ: Asia/Shanghai
      NODE_ENV: production
      PI_SERVER_PORT: "3001"
      MARCUS_API_URL: http://backend:8000/api/v1
      MARCUS_WORKSPACE: /app
      # DSH 文件沙箱：workspace-write（/app 工作区 + /tmp 可写），否则桥接会话只读
      DSH_PERMISSION_MODE: workspace-write
      # DeepSeek 端点：服务器 key 走 OpenCode 网关（.env 的 DEEPSEEK_API_HOST，如 opencode.ai/zen/go）
      # ★ 账本 §9.724 ✓（用户 2026-10-07「前三天怎么这么快」⇒ 追出 AI 全程空转 ✗）：
      #   原写法 `${DEEPSEEK_API_HOST:-…}/v1` ✗ —— 而 .env 里 DEEPSEEK_API_HOST **没有协议头** ✗
      #   ⇒ 拼出 `api.deepseek.com/v1` ⇒ 适配器 `TypeError: Invalid URL` ✗
      #   ⇒ **provider 三个条目全不激活** ✗ ⇒ 回合里没有模型 ⇒ 每次唤醒**空回复** ✗
      #   ⇒ 系统退回「规则兜底」⇒ 表面"跑得飞快"（1 秒/次 ✓）实则 **AI 全程没参与** ✗
      #   ★ 修为：**直接用完整 URL**（带协议头 ＋ `/anthropic` 路径 ✓，与官方 Anthropic 兼容端点一致 ✓）
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}
      DEEPSEEK_API_HOST: ${DEEPSEEK_API_HOST:-api.deepseek.com}
      DEEPSEEK_SEARCH_BASE_URL: https://api.deepseek.com/anthropic/v1
      DEEPSEEK_MODEL: deepseek-flash
      # ★ 账本 §9.697 ✓（② 桥侧回合超时）：默认 0=关 ✓（生产零影响 ✓）
      #   实测：一次回合 370 秒（上游 60 秒失败 × 重试 6 次）⇒ 会话锁被占 ⇒ 客户端集体超时 ✓
      BRIDGE_TURN_TIMEOUT_MS: ${BRIDGE_TURN_TIMEOUT_MS:-0}
      # ★ 账本 §9.698 ✓（用户「设 0」）：空回复后**不再**重建+重试 ✓
      #   实测 ✓：最坏时长 = 适配器 2×60 秒 ＋ 桥重建重试 60~120 秒 = **240 秒** ✗
      #     设 0 ⇒ 最坏降到 **~120 秒** ✓（240 < 420 ⇒ 本来就不超时 ✓，这只是收紧 ✓）
      #   代码默认仍是 **1** ✓（生产零影响 ✓；仅本部署覆盖 ✓）
      BRIDGE_EMPTY_RETRY_MAX: ${BRIDGE_EMPTY_RETRY_MAX:-1}
    ports:
      - "3001:3001"
    volumes:
      - ./bt_tools_allow.txt:/root/.dsh/bt_tools_allow.txt:ro   # ★ §9.722 回测工具白名单（持久化 ✓）
      - ../data:/app/data
      # 只持久化 DSH 会话状态；profile 代码（bridge/npm 依赖/patch）由镜像控制，
      # 避免旧卷里的代码覆盖镜像更新（卷不再覆盖代码）
      - dsh-sessions:/root/.dsh/sessions
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (本地预构建 dist，Dockerfile 只 COPY 到 nginx)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: marcus-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "80:80"
    depends_on:
      - backend
      - dsh

volumes:
  pgdata:
  dsh-sessions: